version: '3'

tasks:
  verify:
    desc: Fast Go-only verification. Excel-bound integration tests are gated by the `excel_integration` build tag and are NOT run here.
    cmds:
      - go vet ./...
      - go build ./...
      - go test -count=1 ./...

  integration:
    desc: Excel COM integration tests (requires Windows + installed Excel). Covers both the core-chain Excel tests and the excel package.
    cmds:
      - go test -count=1 -tags=excel_integration ./...
